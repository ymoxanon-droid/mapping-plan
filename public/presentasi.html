<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapping Plan — Laporan Mingguan</title>
<style>
  :root{
    --bg:#0b1020;--panel:#121a35;--panel2:#0f1730;--line:#243056;--line2:#1a2342;
    --ink:#eef2ff;--muted:#94a3c4;--faint:#6b779e;
    --accent:#6366f1;--accent2:#22d3ee;--ok:#34d399;--warn:#fbbf24;--late:#fb7185;
    --r:18px;--shadow:0 20px 60px rgba(0,0,0,.45);
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);color:var(--ink);overflow:hidden;
    background:radial-gradient(1200px 600px at 85% -10%,rgba(99,102,241,.18),transparent 60%),
      radial-gradient(900px 500px at -5% 110%,rgba(34,211,238,.12),transparent 55%),var(--bg)}
  .pbar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:50;transition:width .4s;box-shadow:0 0 12px rgba(99,102,241,.7)}
  .deck{position:relative;height:100vh;width:100vw}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:6vh 7vw;opacity:0;visibility:hidden;transform:translateY(18px) scale(.99);transition:opacity .5s,transform .5s}
  .slide.active{opacity:1;visibility:visible;transform:none}
  .kicker{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);font-weight:600;margin-bottom:18px}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  h1{font-size:clamp(34px,5.4vw,68px);line-height:1.02;letter-spacing:-.02em;font-weight:800}
  h2{font-size:clamp(26px,3.6vw,44px);line-height:1.06;letter-spacing:-.02em;font-weight:780;margin-bottom:10px}
  .lead{color:var(--muted);font-size:clamp(15px,1.5vw,19px);max-width:62ch;line-height:1.55;margin-top:14px}
  .sub{color:var(--faint);font-size:13.5px;margin-top:26px}
  .brand{position:fixed;left:7vw;bottom:26px;display:flex;align-items:center;gap:11px;z-index:20}
  .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06122b;box-shadow:var(--shadow)}
  .brand .t{font-weight:700;font-size:14px}.brand .s{color:var(--faint);font-size:11.5px}
  .counter{position:fixed;right:7vw;bottom:26px;color:var(--faint);font-size:13px;z-index:20;font-variant-numeric:tabular-nums}
  .nav{position:fixed;right:7vw;bottom:58px;display:flex;gap:8px;z-index:20}
  .nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:16px;transition:.2s}
  .nav button:hover{border-color:var(--accent);background:var(--panel2);transform:translateY(-1px)}
  .grid{display:grid;gap:18px}.cards4{grid-template-columns:repeat(4,1fr)}
  .col2{grid-template-columns:1.1fr .9fr;align-items:center;gap:48px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
  .kpi .big{font-size:clamp(34px,4.2vw,52px);font-weight:820;letter-spacing:-.02em;line-height:1}
  .kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.13em;margin-top:10px}
  .kpi .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:16px;font-size:18px;background:rgba(99,102,241,.14);border:1px solid rgba(99,102,241,.3)}
  .accentbar{height:4px;border-radius:99px;margin-top:18px;background:var(--line)}
  .accentbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .donutwrap{display:flex;align-items:center;gap:30px}
  .donut{position:relative;width:210px;height:210px;flex:none}
  .donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .donut .ctr b{font-size:44px;font-weight:820;letter-spacing:-.02em}
  .donut .ctr span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.14em;margin-top:4px}
  .legend{display:flex;flex-direction:column;gap:14px}
  .legend .row{display:flex;align-items:center;gap:12px;font-size:15px}
  .legend .sw{width:13px;height:13px;border-radius:4px}
  .legend .n{margin-left:auto;font-weight:740;font-variant-numeric:tabular-nums}
  .kanban{grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
  .colhd{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:740;font-size:15px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:auto;font-variant-numeric:tabular-nums}
  .kcol{background:rgba(255,255,255,.02);border:1px solid var(--line2);border-radius:16px;padding:16px;min-height:52vh}
  .titem{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:13px 14px 13px 18px;margin-bottom:11px;font-size:13.5px;line-height:1.4;position:relative}
  .titem .tag{display:block;font-size:10.5px;color:var(--faint);margin-top:7px;letter-spacing:.06em;text-transform:uppercase}
  .edge{position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:99px}
  .flow{display:flex;align-items:stretch;margin-top:6px}
  .step{flex:1;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:20px}
  .step .num{font-size:12px;color:var(--accent2);font-weight:800;letter-spacing:.1em}
  .step h3{font-size:16px;margin:8px 0;font-weight:740}.step p{color:var(--muted);font-size:13px;line-height:1.5}
  .arrow{align-self:center;color:var(--faint);font-size:22px;padding:0 12px}
  .bars{display:flex;flex-direction:column;gap:16px;margin-top:6px}
  .bar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
  .bar .track{height:14px;border-radius:99px;background:var(--line2);overflow:hidden}
  .bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .bar .cnt{color:var(--muted);font-variant-numeric:tabular-nums}
  .timeline{position:relative;margin-top:18px;padding-left:8px}
  .timeline::before{content:"";position:absolute;left:14px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl{display:flex;gap:18px;align-items:flex-start;margin-bottom:16px;position:relative}
  .tl .node{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--panel);border:1px solid var(--line);z-index:2;color:var(--accent2)}
  .tl .body{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:13px 16px;flex:1}
  .tl .body b{font-size:14.5px}.tl .body span{color:var(--muted);font-size:12.5px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
  .chip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
  .chip b{color:var(--ink)}
  .note{font-size:11px;color:var(--faint);max-width:60ch}
  @media(max-width:880px){.cards4{grid-template-columns:repeat(2,1fr)}.col2,.kanban,.flow{grid-template-columns:1fr;display:grid}.arrow{display:none}}
  @media print{.nav{display:none}.slide{position:relative;opacity:1;visibility:visible;transform:none;page-break-after:always;height:100vh}}
</style>
</head>
<body>
<div class="pbar" id="pbar"></div>
<div class="deck" id="deck"></div>
<div class="brand"><div class="logo">M</div><div><div class="t">Mapping Plan</div><div class="s">Central revision tracker</div></div></div>
<div class="nav"><button id="prev">‹</button><button id="next">›</button></div>
<div class="counter"><span id="cur">1</span> / <span id="tot">1</span></div>

<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  EDIT DI SINI SAJA — ganti dengan DATA REAL dari REVISI-LOG.md     ║
   ║  Slide (KPI, donut, kanban, bar, roadmap) otomatis menyesuaikan.  ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const DATA = {
  periode: "(isi tanggal — mis. 23–29 Mei 2026)",
  totalAkumulasi: 50,            // total revisi sepanjang waktu

  // Papan kerja minggu ini. Pindahkan item antar kolom sesuai status real.
  kanban: {
    pending: [
      { title: "Trigger server-side untuk aksi tinggi-risiko", tag: "R-43 · Keamanan" },
      { title: "admin_audit_log jangan dibaca client",          tag: "R-44 · Keamanan" },
      { title: "Promote string literal ke ACTIONS",             tag: "R-45 · Cleanup" },
      { title: "Filter \"exclude noise\"",                       tag: "R-48 · Dashboard" },
      { title: "Group by session · Breadcrumb",                 tag: "R-49 / R-50" },
    ],
    proses: [
      { title: "Investigasi lag hover dashboard (performa)",    tag: "Performa" },
    ],
    selesai: [
      { title: "Aktifkan OTP/2FA + IP whitelist",               tag: "Keamanan · ~2 hari" },
      { title: "Perbaiki UI/UX halaman configuration",          tag: "UI/UX" },
      { title: "Expand baris domain → tabel bersarang",         tag: "UI/UX" },
      { title: "Fix urutan loading data disavow",               tag: "Data" },
      { title: "Fix warna dark mode baris filter",              tag: "UI/UX" },
      { title: "Debug timestamp hilang + Fix AdminPage",        tag: "Bug fix" },
    ],
  },

  // Sorotan 1 revisi (deep-dive). Ambil dari entri R-XX di REVISI-LOG.md.
  deepdive: {
    title: "Aktifkan OTP (2FA) + IP whitelist",
    proyek: "(isi)", status: "Selesai", waktu: "~2 hari", ref: "R-?? · Revisi Log",
    steps: [
      { k: "01 · PERMINTAAN", h: "Amankan login admin",  p: "Bos minta dashboard tidak cukup hanya password — perlu lapis kedua." },
      { k: "02 · SOLUSI",     h: "OTP via email",         p: "Kode sekali-pakai saat login, verifikasi di sisi server (bukan client)." },
      { k: "03 · HARDENING",  h: "IP whitelist",          p: "Hanya IP terdaftar yang boleh mengakses panel admin." },
      { k: "04 · HASIL",      h: "Akses terkunci",        p: "Admin wajib OTP + dari IP sah. Sisa: backup code → berikutnya." },
    ],
  },

  // Distribusi kategori (untuk bar chart). count = jumlah revisi.
  kategori: [
    { label: "🎨 UI / UX",      count: 4 },
    { label: "🔒 Keamanan",     count: 3 },
    { label: "🐛 Bug & Data",   count: 3 },
    { label: "🧹 Cleanup kode", count: 2 },
    { label: "⚡ Performa",     count: 1 },
  ],

  // Antrian minggu depan (timeline).
  roadmap: [
    { num: "43", title: "Trigger server-side untuk aksi tinggi-risiko", tag: "Keamanan" },
    { num: "44", title: "Proteksi tabel admin_audit_log dari client",   tag: "Keamanan" },
    { num: "46", title: "Warna kategori untuk action baru",             tag: "Dashboard" },
    { num: "48", title: "Filter \"exclude noise\" & Group by session",  tag: "Dashboard" },
    { num: "50", title: "Breadcrumb navigasi",                          tag: "UX" },
  ],
};
/* ── akhir blok DATA ── */

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const d = DATA;
const nSel = d.kanban.selesai.length, nPro = d.kanban.proses.length, nPen = d.kanban.pending.length;
const aktif = nSel + nPro + nPen;
const pct = aktif ? Math.round(nSel/aktif*100) : 0;
const maxKat = Math.max(1, ...d.kategori.map(k=>k.count));
const COLORS = ["#34d399","#fb7185","#22d3ee","#6366f1","#fbbf24"];

const items = (arr,color)=>arr.map(t=>`<div class="titem"><span class="edge" style="background:${color}"></span>${esc(t.title)}<span class="tag">${esc(t.tag||"")}</span></div>`).join("");

function donutSeg(){
  const segs=[[nSel,"#34d399"],[nPro,"#fbbf24"],[nPen,"#fb7185"]];
  let off=25, out="";
  for(const [v,c] of segs){ const p=aktif? v/aktif*100:0;
    out+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${c}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}" stroke-linecap="round"/>`;
    off-=p; }
  return out;
}

const SLIDES = [
  `<div class="kicker"><span class="dot"></span> Laporan Mingguan · Internal</div>
   <h1>Progress &amp; Revisi<br>Minggu Ini</h1>
   <p class="lead">Ringkasan eksekutif pekerjaan lintas proyek (SEO · Domain · Database) yang dilacak via dashboard <b>Mapping Plan</b>. Tiap revisi terdokumentasi detail — bukan sekadar "selesai".</p>
   <p class="sub">Periode: <b>${esc(d.periode)}</b> &nbsp;·&nbsp; Disusun via Mapping Plan</p>`,
  `<div class="kicker"><span class="dot"></span> Ringkasan Eksekutif</div><h2>Angka minggu ini</h2>
   <div class="grid cards4" style="margin-top:26px">
     <div class="card kpi"><div class="ic">✅</div><div class="big" style="color:var(--ok)">${nSel}</div><div class="lbl">Revisi Selesai</div><div class="accentbar"><i style="width:${pct}%"></i></div></div>
     <div class="card kpi"><div class="ic">🔄</div><div class="big" style="color:var(--warn)">${nPro}</div><div class="lbl">Sedang Proses</div><div class="accentbar"><i style="width:${aktif?Math.round(nPro/aktif*100):0}%;background:var(--warn)"></i></div></div>
     <div class="card kpi"><div class="ic">⏳</div><div class="big" style="color:var(--late)">${nPen}</div><div class="lbl">Antrian Berikut</div><div class="accentbar"><i style="width:${aktif?Math.round(nPen/aktif*100):0}%;background:var(--late)"></i></div></div>
     <div class="card kpi"><div class="ic">📈</div><div class="big">~${esc(d.totalAkumulasi)}</div><div class="lbl">Total Revisi (akumulasi)</div><div class="accentbar"><i style="width:100%"></i></div></div>
   </div>`,
  `<div class="kicker"><span class="dot"></span> Status Penyelesaian</div><h2>Distribusi status</h2>
   <div class="grid col2" style="margin-top:30px">
     <div class="card"><div class="donutwrap">
       <div class="donut"><svg width="210" height="210" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#1a2342" stroke-width="6"/>${donutSeg()}</svg>
         <div class="ctr"><div><b>${pct}%</b><span>Selesai</span></div></div></div>
       <div class="legend">
         <div class="row"><span class="sw" style="background:var(--ok)"></span> Selesai <span class="n">${nSel}</span></div>
         <div class="row"><span class="sw" style="background:var(--warn)"></span> Proses <span class="n">${nPro}</span></div>
         <div class="row"><span class="sw" style="background:var(--late)"></span> Pending <span class="n">${nPen}</span></div>
       </div></div></div>
     <div><h2 style="font-size:30px">Momentum</h2><p class="lead">Dari ${aktif} revisi aktif minggu ini, <b style="color:var(--ok)">${pct}% tuntas</b>. Sisanya sudah terjadwal dengan detail tersimpan di Revisi Log — konteks tidak hilang.</p></div>
   </div>`,
  `<div class="kicker"><span class="dot"></span> Papan Kerja</div><h2>Alur revisi: Antri → Proses → Selesai</h2>
   <div class="grid kanban" style="margin-top:20px">
     <div><div class="colhd">⏳ Antrian <span class="pill" style="background:rgba(251,113,133,.16);color:var(--late)">${nPen}</span></div><div class="kcol">${items(d.kanban.pending,"var(--late)")}</div></div>
     <div><div class="colhd">🔄 Proses <span class="pill" style="background:rgba(251,191,36,.16);color:var(--warn)">${nPro}</span></div><div class="kcol">${items(d.kanban.proses,"var(--warn)")}</div></div>
     <div><div class="colhd">✅ Selesai <span class="pill" style="background:rgba(52,211,153,.16);color:var(--ok)">${nSel}</span></div><div class="kcol">${items(d.kanban.selesai,"var(--ok)")}</div></div>
   </div>`,
  `<div class="kicker"><span class="dot"></span> Sorotan · Bukan sekadar "sudah ya"</div>
   <h2>Deep-dive: ${esc(d.deepdive.title)}</h2>
   <div class="meta"><span class="chip">Proyek: <b>${esc(d.deepdive.proyek)}</b></span><span class="chip">Status: <b style="color:var(--ok)">${esc(d.deepdive.status)}</b></span><span class="chip">Waktu: <b>${esc(d.deepdive.waktu)}</b></span><span class="chip">Ref: <b>${esc(d.deepdive.ref)}</b></span></div>
   <div class="flow" style="margin-top:14px">${d.deepdive.steps.map((s,i)=>`<div class="step"><div class="num">${esc(s.k)}</div><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p></div>${i<d.deepdive.steps.length-1?'<div class="arrow">→</div>':''}`).join("")}</div>
   <p class="note" style="margin-top:18px">Pola tiap revisi: <b>Permintaan → Solusi → Hasil → Sisa</b> — nilai kerja tiap poin terlihat.</p>`,
  `<div class="kicker"><span class="dot"></span> Komposisi Pekerjaan</div><h2>Revisi berdasarkan kategori</h2>
   <div class="card" style="margin-top:26px"><div class="bars">
     ${d.kategori.map((k,i)=>`<div class="bar"><div class="top"><span>${esc(k.label)}</span><span class="cnt">${k.count}</span></div><div class="track"><div class="fill" style="width:${Math.round(k.count/maxKat*100)}%;background:linear-gradient(90deg,${COLORS[i%COLORS.length]},var(--accent2))"></div></div></div>`).join("")}
   </div></div>`,
  `<div class="kicker"><span class="dot"></span> Rencana Berikutnya</div><h2>Antrian minggu depan</h2>
   <div class="timeline" style="margin-top:8px">${d.roadmap.map(r=>`<div class="tl"><div class="node">${esc(r.num)}</div><div class="body"><b>${esc(r.title)}</b> &nbsp;<span>· ${esc(r.tag)}</span></div></div>`).join("")}</div>`,
  `<div class="kicker"><span class="dot"></span> Penutup</div>
   <h1 style="font-size:clamp(30px,4.6vw,58px)">Setiap revisi<br>terdokumentasi.</h1>
   <p class="lead">Detail tiap poin ada di <b style="color:var(--ink)">Revisi Log</b>; ringkasan di <b style="color:var(--ink)">Presentasi Mingguan</b>. Konteks tidak hilang antar sesi maupun minggu.</p>
   <p class="sub">Terima kasih · Mapping Plan</p>`,
];

const deck=document.getElementById("deck");
deck.innerHTML=SLIDES.map(h=>`<section class="slide">${h}</section>`).join("");
const slides=[...deck.querySelectorAll(".slide")];
const pbar=document.getElementById("pbar"),cur=document.getElementById("cur"),tot=document.getElementById("tot");
let i=0; tot.textContent=slides.length;
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle("active",k===i));cur.textContent=i+1;pbar.style.width=((i+1)/slides.length*100)+"%";}
document.getElementById("next").onclick=()=>show(i+1);
document.getElementById("prev").onclick=()=>show(i-1);
document.addEventListener("keydown",e=>{if(["ArrowRight"," ","PageDown"].includes(e.key))show(i+1);if(["ArrowLeft","PageUp"].includes(e.key))show(i-1);if(e.key==="Home")show(0);if(e.key==="End")show(slides.length-1);});
let x0=null;addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));x0=null;});
show(0);
</script>
</body>
</html>
